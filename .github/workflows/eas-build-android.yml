name: EAS Build & Submit (Android production)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
  workflow_dispatch: {}

concurrency:
  group: eas-build-android-production
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build and submit to Play Store (closed testing / alpha track)
        run: eas build --platform android --profile production --non-interactive --auto-submit
